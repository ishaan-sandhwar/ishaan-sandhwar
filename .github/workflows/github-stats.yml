name: Refresh GitHub stats card

on:
  schedule:
    - cron: "17 3 * * *"        # every day at 03:17 UTC
  workflow_dispatch:             # and on demand from the Actions tab

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the stats card from public GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/github_stats.py --user "${{ github.repository_owner }}" --out docs/github-stats.svg --theme slate

      - name: Commit the card if it changed
        run: |
          if [ -n "$(git status --porcelain docs/github-stats.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/github-stats.svg
            git commit -m "chore: refresh GitHub stats card"
            git push
          fi
